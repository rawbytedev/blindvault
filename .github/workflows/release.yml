name: Manual Release Build

permissions: {}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true

jobs:
  build:
    permissions:
      contents: read
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows]
        goarch: [amd64, arm64]
        exclude:
          - goos: windows
            goarch: arm64   # blst doesn't support windows/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 gcc-aarch64-linux-gnu

      - name: Build binaries
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
          CC: ${{ 
               (matrix.goos == 'linux' && matrix.goarch == 'arm64' && 'aarch64-linux-gnu-gcc') ||
               (matrix.goos == 'windows' && matrix.goarch == 'amd64' && 'x86_64-w64-mingw32-gcc') ||
               ''
             }}
        run: |
          go build -o bv-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/bv
          go build -o blindvault-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goos == 'windows' && '.exe' || '' }} ./cmd/server

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            bv-*
            blindvault-*

  js-sdk:
    name: Build JavaScript SDK package
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: js_client/package-lock.json

      - name: Install JS dependencies
        working-directory: js_client
        run: npm ci

      - name: Build JS SDK package
        working-directory: js_client
        run: npm run build:lib && npm pack

      - name: Upload JS SDK artifact
        uses: actions/upload-artifact@v4
        with:
          name: js-sdk-package
          path: js_client/*.tgz

  release:
    name: Create draft release and attach binaries
    permissions:
      contents: write  # required to create releases
    needs: [build, js-sdk]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history + tags
          fetch-tags: true

      
      - name: Download all built binaries and SDK
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes from commits
        id: changelog
        env:
          CURRENT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          git fetch --tags --force

          # Most recent tag
          PREV_TAG=$(git tag --sort=-v:refname | grep -vxF -- "$CURRENT_VERSION" | head -n1 || true)

          if [ -z "${PREV_TAG:-}" ]; then
            echo "No previous tag found — listing all commits."
            RANGE="HEAD"
            HEADER="## What's Changed\n\n_(no previous release found — showing full history)_"
          else
            echo "Previous tag: $PREV_TAG"
            RANGE="${PREV_TAG}..HEAD"
            HEADER="## What's Changed since \`${PREV_TAG}\`"
          fi

          {
            printf "%b\n\n" "$HEADER"
            git log "$RANGE" --no-merges --pretty=format:'- %s (%h) — @%an'
            echo
          } > RELEASE_BODY.md

          echo "----- RELEASE_BODY.md -----"
          cat RELEASE_BODY.md
          echo "---------------------------"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Release ${{ github.event.inputs.version }}
          draft: ${{ github.event.inputs.draft }}
          body_path: RELEASE_BODY.md
          files: |
            artifacts/**/bv-*
            artifacts/**/blindvault-*
            artifacts/**/*.tgz
