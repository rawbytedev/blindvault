services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  blindvault:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      BLINDVAULT_MODE: "development"
      BLINDVAULT_MASTER_SEED_HEX: "000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f"
      ACTIVE_EPOCH: "2026-01"
      SUPPORTED_EPOCHS: "2026-01,2025-12"
      DST: "BCIS-V1-MESSAGE"
      LISTEN_ADDR: ":8080"
      AUTH_SECRET: "super-secret-token"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ""
      REDIS_DB: "0"
      REDIS_EXPIRATION: "2592000"
      REVOCATION_REDIS_ADDR: "redis:6379"
      REVOCATION_REDIS_PASSWORD: ""
      REVOCATION_REDIS_DB: "1"
      USE_MEMORY_STORE: "false"
      USE_DEMO: "true"
      RATE_LIMIT_REQUESTS: "100"
      RATE_LIMIT_BURST: "20"
      MAX_CLIENTS: "100000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
  retries: 5
    restart: unless-stopped
    

volumes:
  redis-data:
